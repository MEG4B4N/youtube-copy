<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="StreamHub — смотри видео, сохраняй интересное и делись своими роликами.">
  <title>StreamHub — видеоплатформа</title>
  <link rel="preload" href="/assets/styles.css" as="style">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn mobile-menu" id="menu-toggle" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="/" data-link aria-label="StreamHub — главная">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6z"/></svg></span>
      <span>StreamHub</span><sup>RU</sup>
    </a>
    <form class="searchbar" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Введите запрос" aria-label="Поиск видео" autocomplete="off">
      <button aria-label="Найти" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
    </form>
    <div class="top-actions" id="top-actions"><a class="btn btn-outline" href="/login" data-link>Войти</a></div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <nav class="sidebar-nav">
        <div class="nav-group">
          <a href="/" data-link data-nav="home" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            <span>Главная</span>
          </a>
          <a href="/?sort=popular" data-link data-nav="trending" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 7.5-3 7.5-7.1 0-2.6-1.4-4.8-4.1-7.1.1 2.1-.6 3.5-1.8 4.2C13.9 7.1 11.8 3.6 7.7 2c.5 4.7-3.2 7.2-3.2 12.4C4.5 18.6 7.6 22 12 22Z"/><path d="M12 22c-1.9-1.1-2.8-2.6-2.8-4.5 0-1.4.7-2.7 1.8-3.8.3 1.5 1 2.4 2.1 2.8 1.1 1.8.7 4.1-1.1 5.5Z"/></svg>
            <span>В тренде</span>
          </a>
          <a href="/subscriptions" data-link data-nav="subscriptions" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3zM7 2h10"/></svg>
            <span>Подписки</span>
          </a>
        </div>

        <div class="nav-divider"></div>
        <div class="nav-section-title"><span>Вы</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></div>
        <div class="nav-group nav-library">
          <a href="/history" data-link data-nav="history" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3.5 2"/></svg>
            <span>История</span>
          </a>
          <a href="/playlists" data-link data-nav="playlists" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13M4 10h13M4 15h8M4 20h8"/><path d="m16 14 5 3.5-5 3.5z"/></svg>
            <span>Плейлисты</span>
          </a>
          <a href="/watch-later" data-link data-nav="watch-later" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            <span>Смотреть позже</span>
          </a>
          <a href="/liked" data-link data-nav="liked" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM7 10l4-7a3 3 0 0 1 2 3v4h5.5a3 3 0 0 1 2.9 3.8l-1.7 6A3 3 0 0 1 16.8 22H7"/></svg>
            <span>Понравившиеся</span>
          </a>
          <a href="/your-videos" data-link data-nav="your-videos" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
            <span>Ваши видео</span>
          </a>
          <a href="/downloads" data-link data-nav="downloads" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/></svg>
            <span>Загрузки</span>
          </a>
        </div>

        <div class="nav-divider"></div>
        <div class="nav-group">
          <a href="/login" data-link id="my-channel-link" data-nav="my-channel" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>Мой канал</span>
          </a>
          <a href="/upload" data-link data-nav="upload" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Загрузить видео</span>
          </a>
          <a href="/studio/moderation" data-link id="moderation-link" data-nav="moderation" class="nav-item" hidden>
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 7v5c0 5-3.8 8-9 10-5.2-2-9-5-9-10V7z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Модерация</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-note">StreamHub · видеоплатформа</div>
    </aside>

    <main id="app" class="content" tabindex="-1"><div class="loading">Загрузка…</div></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
